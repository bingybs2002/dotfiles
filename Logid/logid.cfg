devices:
(
    {
        name = "MX Master 3 for Business";
        smartshift:
        {
            on: true;
            threshold: 80;
        };
        hiresscroll:
        {
            hires: false;
            invert: false;
            target: false;
        };
        dpi: 800;
        buttons: (
            {
                cid: 0xc3;
                action =
                {
                    type: "Gestures";
                    gestures: (
                        {
                            direction: "Down";
                            mode: "OnInterval";
                            interval: 100;
                            action =
                            {
                                type: "Keypress";
                                keys: ["KEY_BRIGHTNESSDOWN"];
                            };
                        },
                        {
                            direction: "Up";
                            mode: "OnInterval";
                            interval: 100;
                            action =
                            {
                                type: "Keypress";
                                keys: ["KEY_BRIGHTNESSUP"];
                            };
                        },
                        {
                            direction: "Left";
                            mode: "OnRelease";
                            action =
                            {
                                type: "Keypress";
                                keys: ["KEY_LEFTCTRL", "KEY_LEFTMETA", "KEY_LEFT"];
                            };
                        },
                        {
                            direction: "Right";
                            mode: "OnRelease";
                            action =
                            {
                                type: "Keypress";
                                keys: ["KEY_RIGHTCTRL", "KEY_LEFTMETA", "KEY_RIGHT"];
                            }
                        },
                        {
                            direction: "None";
                            mode: "OnRelease";
                            action =
                            {
                                type: "Keypress";
                                keys: ["KEY_LEFTALT","KEY_TAB"];
                            };
                        }
                    );
                };
            },
            {
                cid: 0xc4;
                action =
                {
                    type = "Keypress";
                    keys: ["KEY_SYSRQ"];
                };
            },
            {
                cid: 0x56;
                action =
                {
                    type : "Keypress";
                    keys: ["KEY_LEFTALT", "KEY_RIGHT"];
                };
            },

            # Back button
            {
                cid: 0x53;
                action =
                {
                    type : "Keypress";
                    keys: ["KEY_LEFTALT", "KEY_LEFT"];
                };
            }
        );
    }
);

